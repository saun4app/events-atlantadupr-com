openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Atlanta DUPR Pickleball Events API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: members
    description: DUPR member list operations
  - name: events
    description: Event operations
  - name: registrations
    description: Registration and roster operations
  - name: users
    description: User management operations
  - name: settings
    description: App settings operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all DUPR members
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or DUPR ID
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [playerName, doubleRating, singleRating, doubleReliability, singleReliability]
          description: Field to sort by
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Add a new member (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: clearAllMembers
      tags: [members]
      summary: Delete all members (Admin only)
      responses:
        "204":
          description: All members deleted

  /members/csv:
    post:
      operationId: uploadMembersCsv
      tags: [members]
      summary: Upload members via CSV (Admin only)
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: CSV file contents
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvUploadResult"

  /members/{duprId}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by DUPR ID
      parameters:
        - in: path
          name: duprId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Member not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member (Admin only)
      parameters:
        - in: path
          name: duprId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Member not found
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member (Admin only)
      parameters:
        - in: path
          name: duprId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member deleted
        "404":
          description: Member not found

  /events/summary:
    get:
      operationId: getEventsSummary
      tags: [events]
      summary: Get high-level event statistics
      responses:
        "200":
          description: Event summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsSummary"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - in: query
          name: upcoming
          schema:
            type: boolean
          description: Filter to only upcoming events
        - in: query
          name: search
          schema:
            type: string
          description: Search by event name or location
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (Admin/Organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event(s) created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event (Admin/Organizer)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event (Admin/Organizer)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted
        "404":
          description: Event not found

  /events/{id}/clone:
    post:
      operationId: cloneEvent
      tags: [events]
      summary: Clone an event as a new draft (Admin/Organizer)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCloneInput"
      responses:
        "201":
          description: Cloned event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Source event not found

  /events/{id}/close:
    post:
      operationId: closeEvent
      tags: [events]
      summary: Close registration for an event (end it)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}/roster-summary:
    get:
      operationId: getEventRosterSummary
      tags: [events]
      summary: Get confirmed/waitlisted/pending counts for an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roster summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterSummary"

  /events/{id}/registrations:
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: List all registrations for an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of roster entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterEntry"
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Register for an event using DUPR ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "400":
          description: Signup window closed, already registered, or member not found
        "404":
          description: Event not found

  /events/{id}/registrations/{regId}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: regId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "404":
          description: Not found
    patch:
      operationId: updateRegistration
      tags: [registrations]
      summary: Update a registration (Admin/Organizer)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: regId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationUpdate"
      responses:
        "200":
          description: Registration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteRegistration
      tags: [registrations]
      summary: Remove a registration (Admin/Organizer)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: regId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Registration removed
        "404":
          description: Not found

  /events/{id}/registrations/{regId}/approve:
    post:
      operationId: approveRegistration
      tags: [registrations]
      summary: Approve a pending registration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: regId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"

  /events/{id}/registrations/{regId}/reject:
    post:
      operationId: rejectRegistration
      tags: [registrations]
      summary: Reject a pending registration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: regId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"

  /events/{id}/registrations/{regId}/promote:
    post:
      operationId: promoteFromWaitlist
      tags: [registrations]
      summary: Promote a waitlisted registration to confirmed
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: regId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Promoted to confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get app-level settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update app-level settings (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsInput"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (Admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, username, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, event_organizer, event_participant, event_captain, court_leader]
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, username, password, role]
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, event_organizer, event_participant, event_captain, court_leader]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, event_organizer, event_participant, event_captain, court_leader]

    Member:
      type: object
      required: [duprId, playerName]
      properties:
        duprId:
          type: string
        playerName:
          type: string
        doubleRating:
          type: ["string", "null"]
        doubleReliability:
          type: ["integer", "null"]
        singleRating:
          type: ["string", "null"]
        singleReliability:
          type: ["integer", "null"]
        selfRating:
          type: ["string", "null"]

    MemberInput:
      type: object
      required: [duprId, playerName]
      properties:
        duprId:
          type: string
        playerName:
          type: string
        doubleRating:
          type: ["string", "null"]
        doubleReliability:
          type: ["integer", "null"]
        singleRating:
          type: ["string", "null"]
        singleReliability:
          type: ["integer", "null"]
        selfRating:
          type: ["string", "null"]

    MemberUpdate:
      type: object
      properties:
        playerName:
          type: string
        doubleRating:
          type: ["string", "null"]
        doubleReliability:
          type: ["integer", "null"]
        singleRating:
          type: ["string", "null"]
        singleReliability:
          type: ["integer", "null"]
        selfRating:
          type: ["string", "null"]

    CsvUploadResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    Event:
      type: object
      required: [id, name, startDatetime, endDatetime, locationName, locationAddress, formatType, ratingTypeRequired, minParticipants, maxParticipants, waitlistEnabled, requireApproval, signupStartDatetime, signupEndDatetime, status, courtFeeEnabled, memberFee, nonMemberFee, createdAt]
      properties:
        id:
          type: integer
        seriesId:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        locationName:
          type: string
        locationAddress:
          type: string
        formatType:
          type: string
          enum: [fixed_partner, rotating]
        ratingTypeRequired:
          type: string
        minParticipants:
          type: integer
        maxParticipants:
          type: integer
        waitlistEnabled:
          type: boolean
        requireApproval:
          type: boolean
        signupStartDatetime:
          type: string
          format: date-time
        signupEndDatetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [upcoming, closed, ended]
        courtFeeEnabled:
          type: boolean
        memberFee:
          type: number
        nonMemberFee:
          type: number
        createdAt:
          type: string
          format: date-time

    EventCloneInput:
      type: object
      properties:
        name:
          type: string
          description: Override name for the cloned event (default appends " (Copy)")

    RecurrenceInput:
      type: object
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        occurrences:
          type: integer
          minimum: 2
          maximum: 52
        dates:
          type: array
          items:
            type: string
            format: date-time
          description: Explicit ISO datetimes for additional occurrences (after the start event)

    EventInput:
      type: object
      required: [name, startDatetime, endDatetime, locationName, locationAddress, formatType, ratingTypeRequired, minParticipants, maxParticipants, waitlistEnabled, requireApproval, signupStartDatetime, signupEndDatetime]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        locationName:
          type: string
        locationAddress:
          type: string
        formatType:
          type: string
          enum: [fixed_partner, rotating]
        ratingTypeRequired:
          type: string
        minParticipants:
          type: integer
        maxParticipants:
          type: integer
        waitlistEnabled:
          type: boolean
        requireApproval:
          type: boolean
        signupStartDatetime:
          type: string
          format: date-time
        signupEndDatetime:
          type: string
          format: date-time
        courtFeeEnabled:
          type: boolean
        memberFee:
          type: number
        nonMemberFee:
          type: number
        recurrence:
          $ref: "#/components/schemas/RecurrenceInput"

    EventUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        locationName:
          type: string
        locationAddress:
          type: string
        formatType:
          type: string
          enum: [fixed_partner, rotating]
        ratingTypeRequired:
          type: string
        minParticipants:
          type: integer
        maxParticipants:
          type: integer
        waitlistEnabled:
          type: boolean
        requireApproval:
          type: boolean
        signupStartDatetime:
          type: string
          format: date-time
        signupEndDatetime:
          type: string
          format: date-time
        status:
          type: string
          enum: [upcoming, closed, ended]
        courtFeeEnabled:
          type: boolean
        memberFee:
          type: number
        nonMemberFee:
          type: number

    EventsSummary:
      type: object
      required: [totalUpcoming, openForSignup, totalEvents]
      properties:
        totalUpcoming:
          type: integer
        openForSignup:
          type: integer
        totalEvents:
          type: integer

    RosterSummary:
      type: object
      required: [confirmed, waitlisted, pendingApproval, total, maxParticipants]
      properties:
        confirmed:
          type: integer
        waitlisted:
          type: integer
        pendingApproval:
          type: integer
        total:
          type: integer
        maxParticipants:
          type: integer

    RosterEntry:
      type: object
      required: [id, eventId, memberDuprId, status, registeredAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        memberDuprId:
          type: string
        partnerDuprId:
          type: ["string", "null"]
        status:
          type: string
          enum: [confirmed, waitlisted, pending_approval, rejected]
        registeredAt:
          type: string
          format: date-time
        approvedAt:
          type: ["string", "null"]
        approvedBy:
          type: ["integer", "null"]
        playerName:
          type: string
        doubleRating:
          type: ["string", "null"]
        singleRating:
          type: ["string", "null"]
        selfRating:
          type: ["string", "null"]
        partnerName:
          type: ["string", "null"]

    RegistrationInput:
      type: object
      required: [memberDuprId]
      properties:
        memberDuprId:
          type: string
        partnerDuprId:
          type: ["string", "null"]

    RegistrationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, waitlisted, pending_approval, rejected]
        partnerDuprId:
          type: ["string", "null"]

    ContactPerson:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    RatingRequirement:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string

    DefaultLocation:
      type: object
      required: [id, name, address]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        memberFee:
          type: number
          description: Default court fee for members (dollars)
        nonMemberFee:
          type: number
          description: Default court fee for non-members (dollars)
        courtFeeEnabled:
          type: boolean

    AppSettings:
      type: object
      required: [defaultTimezone, rotatingPartnersDescription, fixedPartnerDescription, minParticipants, maxParticipants, minTeams, maxTeams, contactPersons, defaultLocations, maintenanceMode, defaultEventNames, defaultEventDurationHours, defaultRatingRequirements]
      properties:
        defaultTimezone:
          type: string
        rotatingPartnersDescription:
          type: string
        fixedPartnerDescription:
          type: string
        minParticipants:
          type: integer
        maxParticipants:
          type: integer
        minTeams:
          type: integer
        maxTeams:
          type: integer
        contactPersons:
          type: array
          items:
            $ref: "#/components/schemas/ContactPerson"
        defaultLocations:
          type: array
          items:
            $ref: "#/components/schemas/DefaultLocation"
