openapi: 3.1.0
info:
  title: DUPR Event API Server
  version: 1.0.0
  summary: Shared contract for the modular DUPR Event API server
  description: >-
    Platform-level OpenAPI components for independently registered API modules.
    Domain modules own their paths and domain schemas while reusing this
    contract for authentication, common errors, pagination, concurrency, and
    document envelopes.
  contact:
    name: API support
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Modular DUPR Event API base path
x-module-registration:
  compositionRoot: src/app.ts
  registrationInterface: ApiModule.register(platform)
  rule: Platform services may support modules but platform code never imports domain modules.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [platform]
      summary: Check whether the server process is alive
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [platform]
      summary: Check whether platform dependencies and registered modules are ready
      security: []
      responses:
        "200":
          description: The server is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC bearer token for independent clients.
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Signed staff session cookie; state-changing requests also require the shared CSRF header and allowed origin.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional expected document version or updatedAt value for optimistic concurrency.
      schema:
        type: string
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client correlation ID echoed in logs and responses.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for safely retrying a supported mutation.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request syntax or a shared HTTP rule is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated principal lacks the required organization or module access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The mutation conflicts with current state or document version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The request exceeded a configured platform or module rate limit.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until retry is permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Request is syntactically valid but fails domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The server, a registered module, or a required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    DocumentEnvelope:
      type: object
      required: [documentId, documentType, schemaVersion, module, createdAt, updatedAt, data]
      properties:
        documentId:
          type: string
          minLength: 1
        documentType:
          type: string
          minLength: 1
        schemaVersion:
          type: integer
          minimum: 1
        module:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        data:
          type: object
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: [string, "null"]
        code:
          type: [string, "null"]
      additionalProperties: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [ok, failed]
              detail:
                type: string
            additionalProperties: false
      additionalProperties: false